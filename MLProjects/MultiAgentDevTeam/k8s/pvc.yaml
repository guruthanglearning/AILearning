# Saved pipeline sessions live here so they survive pod restarts and redeploys.
# Deleted with the namespace (deploy-k8s.ps1 -Down).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sessions
  namespace: multi-agent-dev-team
  labels:
    app: orchestrator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
